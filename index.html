<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Reserva una pista del polideportivo en menos de un minuto.">
    <title>libreryPorts</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <a href="#" class="logo" aria-label="Inicio"></a>
        <nav aria-label="Acciones principales">
            <button type="button" aria-label="Buscar libros">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <button type="button" aria-label="Abrir menú">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <button type="button" aria-label="Ver carrito">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    aria-hidden="true">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
            </button>
        </nav>
    </header>

    <main>
        <img src="estanteria.jpg" alt="Estantería con el total de libros" class="banner">

        <section class="categorias" aria-label="Categorías de libros">
            <article class="tarjeta">
                <img src="libro.jpg" alt="">
                <a href="#en-prestamo" class="btn-categoria">En préstamo</a>
            </article>

            <article class="tarjeta">
                <img src="libro.jpg" alt="">
                <a href="#deseados" class="btn-categoria">Deseados</a>
            </article>

            <article class="tarjeta">
                <img src="libro.jpg" alt="">
                <a href="#en-posesion" class="btn-categoria">En posesión</a>
            </article>

            <article class="tarjeta">
                <img src="libro.jpg" alt="">
                <a href="#prestados" class="btn-categoria">Prestados</a>
            </article>
        </section>
    </main>

</body>

</html>
